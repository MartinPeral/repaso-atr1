<!-- ===================== TEORÍA ===================== -->
<script type="text/markdown" id="ficha-dns">
## Paradigmas
- **Cliente-servidor:** servidor siempre activo con IP fija. Problema: cuello de botella. Puede haber servidores de respaldo y de apoyo.
- **P2P:** sin servidor; los pares hablan entre sí. Problema: difícil de gestionar.
- **Híbrido:** el servidor solo localiza a los pares (chat, VoIP).

## Sistemas de nombres
- **Plano:** sin estructura, administración centralizada, nombres únicos, poco escalable (el Internet inicial).
- **Jerárquico:** con estructura, distribuido, el mismo nombre en ramas distintas; cada servidor gestiona su ámbito.

## Qué es DNS
- Servicios: nombre ↔ IP, alias y reparto de carga (varias IP para un nombre).
- Define: espacio de nombres jerárquico, organización burocrática, protocolo de aplicación y base de datos distribuida.

## Espacio de nombres
- Árbol invertido. La raíz tiene etiqueta vacía (".").
- Etiqueta: **máx. 63 caracteres**. Árbol: **máx. 127 niveles**.
- Misma etiqueta permitida si **no son hermanos**.
- **FQDN:** nombre absoluto terminado en punto (`www.dte.us.es.`).

## Burocracia
- **Raíz:** 13 servidores (a–m). Los coordina **IANA**, que crea y elimina TLD pero no los gestiona.
- **TLD:** gTLD (.com .net .org libres; .edu .gov .mil restringidos; .cat .info patrocinados), ccTLD (.es…), **.arpa** (inversa), reservados (.test .example .invalid .localhost).
- **Autoritativos:** los de cada organización.
- **Registry** mantiene un TLD · **registrador** es el intermediario · **registrant** es el dueño · **whois** lo aloja el registry y lo actualiza el registrador.
- **Delegación:** el padre solo guarda a quién preguntar (NS + A si hace falta).
- **Zona** = lo que gestiona una entidad. **Dominio** = el subárbol entero.
- **Master** tiene los datos originales; **slave** guarda una copia.

## Resolución
- Host → DNS por defecto: **recursiva**. DNS por defecto → jerarquía: **iterativas**.
- Raíz y TLD **no aceptan recursivas** (tendrían que reservar recursos).
- Si el DNS por defecto es autoritativo, responde con sus mapas. Si no, mira la caché y, si no lo tiene, recorre la jerarquía.

## Caché y TTL
- Guarda la respuesta y los servidores que intervinieron, cada línea durante su **TTL**.
- TTL pequeño → más carga. TTL grande → posibles incoherencias.

## Registros
- **SOA:** servidor principal + correo del admin (1.er punto = @) + Serial (YYYYMMDDnn) · Refresh · Retry · Expire · Minimum (**TTL negativo**).
- **NS:** servidores DNS, sin orden, pueden estar en otros dominios.
- **MX:** correo; se usa primero el de **número menor**.
- **A:** nombre → IP. **CNAME:** alias → nombre canónico. **PTR:** IP → nombre en `in-addr.arpa` (IP al revés).
- `$ORIGIN` es el dominio por defecto, `@` lo sustituye y un nombre **sin punto final** recibe el $ORIGIN detrás.

## Mensaje DNS
Consulta · Respuestas · Autoridad · Adicional.

## Pila de una consulta
DNS / **UDP 53** / IP / Ethernet. El cliente se identifica por su puerto origen, su IP y su MAC.
</script>

<script type="text/markdown" id="ficha-ldap">
## Servicio de directorio
- Administra y organiza recursos y usuarios de una red.
- Optimizado para **consultas** (usa caché), distribuido, extensible, con búsquedas avanzadas y replicación.

## LDAP
- RFC 4510–4519: **4511 protocolo**, **4512 modelos**, 4513 seguridad, **4519 esquema**. Versión **3**.
- Basado en **X.500**, pero sobre **TCP/IP** (no OSI) y con menos operaciones.
- Cliente-servidor: **DUA** (cliente) y **DSA** (servidor).
- No dice cómo se almacena la información: es transparente para el cliente.
- Dos modelos: **información** y **protocolo**.

## Modelo de información
- **DIB:** toda la información. Cada DSA gestiona un trozo.
- **Entrada:** unidad básica. Puede ser objeto o **alias** (nombre alternativo).
- **Atributo:** descripción + valores. No puede haber dos valores equivalentes ("john" = "JOHN" en givenName).
- **Tipo de atributo:** sintaxis, si es multivaluado, reglas de comparación y si es de usuario u operacional. Se identifica con un **OID**.
- **Clase de objeto:** atributos **requeridos** y **permitidos**, se identifica con un OID y **hereda** de sus superclases.
- **Esquema:** impide clases subordinadas incorrectas, atributos no permitidos y valores con sintaxis mala.

## DIT y nombres
- **DIT:** el DIB organizado en árbol.
- **RDN:** pares atributo=valor (se pueden unir con `+`), **único entre hermanos**.
- **DN:** los RDN desde la entrada hasta la raíz, **único en todo el DIT**.
- Profundidad **mínima**: el dominio puede ser un único nodo (`dc=us,dc=es`).

## Administrativo y operacional
- **objectClass:** está en todas las entradas; se puede modificar pero **no borrar**.
- **Atributos operacionales:** no se devuelven salvo que se pidan. Ejemplos: creatorsName, createTimestamp, modifiersName, modifyTimestamp.
- **Contexto de nombre:** subárbol de un único DSA maestro; su prefijo es el DN del nodo inicial.
- Copias: servidores shadowing o caching.

## Protocolo
- **TCP 389**. Operaciones independientes y atómicas; no hace falta que sean síncronas.
- Operaciones: Bind, Unbind, Unsolicited notification, Search, Modify, Add, Delete, Modify DN, Compare, Abandon, Start TLS y Extended.
- Respuesta: **un solo código** de resultado, diagnosticMessage (texto libre, puede ir vacío) y matchedDN.
- **Referral:** "yo no, pero prueba aquí" (al menos una URI). No aparece en Unbind ni en Abandon. El cliente debe evitar bucles.
</script>

<script type="text/markdown" id="ficha-ftp">
## TFTP (RFC 1350)
- **UDP 69**. Simple y no fiable, sin carpetas ni cifrado. Para ficheros pequeños.
- Opcodes: **1 RRQ · 2 WRQ · 3 DATA · 4 ACK · 5 ERROR**.
- RRQ y WRQ: nombre, 0, modo (**netascii** u **octet**), 0 y opciones.
- RRQ → **DATA 1** o ERROR. WRQ → **ACK 0** o ERROR.
- DATA: número de bloque (1–65535) + **0–512 bytes**. ACK: solo el número de bloque.
- Último bloque: **menos de 512 bytes**. Si el tamaño es múltiplo de 512 → DATA final de **0 bytes**.
- Perder un mensaje = retransmitir todo el fichero.
- Errores: 0 no definido · **1 File not found** · **2 Access violation** · 3 Disk full · **6 File already exists**.

## Cuenta de mensajes
- N bloques de datos = ⌊tamaño/512⌋ + 1.
- **Lectura:** RRQ + N DATA + N ACK.
- **Escritura:** WRQ + ACK 0 + N DATA + N ACK.

## FTP (RFC 959)
- **TCP**, dos conexiones: **control 21** y **datos 20** (activo).
- **Activo:** el **servidor** abre los datos desde el puerto 20.
- **Pasivo:** el cliente manda **PASV**, el servidor responde **PORT** con un puerto y el **cliente** abre los datos.
- Se negocian el puerto de datos, el modo (activo o pasivo) y la transferencia (ASCII o binario).
- Comandos del protocolo: USER, PASS, LIST, **RETR** (bajar), **STOR** (subir).
- Comandos del cliente: cd, get, put, mkdir, exit.
- Respuestas: **331** falta la contraseña · **125** empieza la transferencia · **425** no se abre la conexión de datos · **452** error al escribir.
- Configuración: puertos, máximo de conexiones (total y por IP), timeout, mensajes, usuarios y anónimos, grupos, permisos rwx, ancho de banda y logs.
</script>

<script type="text/markdown" id="reglas">
## 1. Lee el nombre de derecha a izquierda
`www.a2.rediris.com.` → raíz → com → rediris → a2 → www. Cada servidor solo conoce al siguiente.

## 2. Cada referencia es una pareja NS + A
- **NS:** quién lleva el dominio. **A:** dónde está ese servidor.
- El A (glue) es imprescindible si el servidor está **dentro** del dominio que se delega.
- La respuesta final es solo un A (o un CNAME + A).

## 3. Recursiva arriba, iterativas abajo
- Cliente → DNS por defecto: recursiva.
- DNS por defecto → raíz, TLD y autoritativos: iterativas.
- Raíz y TLD no aceptan recursivas: si te los ponen como DNS por defecto, solo dan una referencia.

## 4. Solo guarda caché quien resuelve
El DNS por defecto. Los que reciben iterativas responden con sus propios datos y no aprenden nada.

## 5. Para una consulta nueva con caché
1. ¿Está vivo el registro final (TTL > tiempo transcurrido)? Se responde desde la caché.
2. Si no, busca el **NS vivo más cercano** al nombre **que además tenga vivo su A**.
3. Si no queda ninguno, empieza por la raíz.
Un A vivo sin su NS no sirve: no sabes qué dominio lleva ese servidor.

## 6. Reconstruir el viaje desde una caché
- El único A que no es de un servidor DNS es lo que se preguntó.
- Si no hay NS de un nivel, el servidor era **autoritativo** de ese nivel.
- Paquete de respuesta: **origen = servidor**, **destino = cliente**.

## 7. ¿Quién es esa IP?
Antes de contestar, identifica la IP: ¿un DNS por defecto, un autoritativo, un TLD o un cliente? Si te dicen que los DNS están en un rango (100.0.0.0/8…), una IP fuera de ese rango **no es un DNS**.

## 8. ¿Autoritativa o no?
Autoritativa si responde un servidor **de la zona** (primario o secundario). Si responde desde la caché, no lo es ("Non-authoritative answer").

## 9. Tiempos que preguntan
- Cambio de un registro: los secundarios lo copian en **Refresh** + las cachés lo guardan su **TTL**. Máximo: Refresh + TTL.
- Respuesta negativa en caché: dura el **Minimum** del SOA.
- El primario parado: el secundario responde hasta **Expire**, y no se pueden hacer cambios (se hacen en el primario).

## 10. Añadir un dominio
- **Padre:** NS + A (glue) del nuevo servidor.
- **Zona nueva:** SOA, NS, A del servidor, MX y A del correo.
- Un host nuevo en una zona que ya existe: solo su A en esa zona.
- Un alias va en la zona **del alias**. Un PTR, en la zona inversa de la IP (al revés).

## 11. Errores típicos en ficheros de zona
- Nombre **sin punto final** → se le pega el $ORIGIN.
- Registros de **otra zona** metidos en esta.
- MX o NS que apuntan a nombres **sin A**.
- SOA con un primario que no aparece en los NS.
- Erratas entre el NS y su A (severA ≠ serverA).
- Un espacio dentro de un nombre ("serverd. enero…").
</script>

<script type="text/markdown" id="enu-2.1">
Listín telefónico LDAP para la Universidad de Sevilla (raíz `dc=us,dc=es`): un directorio **corporativo** con los teléfonos de todo el personal y un **listín personal** para cada trabajador. Cada entrada lleva al menos nombre (givenName), apellidos (sn) y teléfono (tel). Puede haber **personas con el mismo nombre** y **teléfonos compartidos**.
</script>
<script type="text/markdown" id="sol-2.1">
## a) DIT
```
dc=us,dc=es
 ├─ ou=corporativo
 │    └─ givenName=…+sn=…+tel=…      (contacto)
 └─ ou=personal
      └─ uid=orivera                 (trabajador)
           └─ givenName=…+sn=…+tel=… (contacto)
```
- **dominio** (`dc`): raíz.
- **organizationalUnit** (`ou`): corporativo y personal.
- **trabajador:** uid (requerido), givenName, sn.
- **contacto:** givenName, sn, tel (requeridos); mail (opcional).

## b) RDN
Ni el nombre (hay homónimos) ni el teléfono (se comparte) bastan por separado. Se combinan:
`givenName=Octavio+sn=Rivera+tel=954552789`

## c) DN
`givenName=Octavio+sn=Rivera+tel=954552789, ou=corporativo, dc=us, dc=es`
</script>

<script type="text/markdown" id="sol-2.2">
## a) ¿Histórico?

**Sí**, si el atributo `atleta` se define como **multivaluado**: una sola entrada con dos valores de atleta. El RDN no incluye al atleta, así que no hay conflicto.

<script type="text/markdown" id="enu-3.1">
El host A quiere **mandar** el fichero `prueba.txt`, de **1024 bytes**, por TFTP. Escribe los mensajes entre cliente y servidor.
</script>
<script type="text/markdown" id="sol-3.1">
Mandar = escribir → **WRQ**. 1024 = 512 + 512 + **0** (es múltiplo de 512, así que va un último DATA vacío).
```
C → S  WRQ  [02 | prueba.txt | 0 | netascii | 0]
S → C  ACK  [04 | 0]
C → S  DATA [03 | 1 | 512 B]
S → C  ACK  [04 | 1]
C → S  DATA [03 | 2 | 512 B]
S → C  ACK  [04 | 2]
C → S  DATA [03 | 3 | 0 B]   ← último (< 512)
S → C  ACK  [04 | 3]
```
En total, 8 mensajes.
</script>

<script type="text/markdown" id="enu-3.2">
Cronograma TFTP con errores. El cliente tiene `fichero1.txt` (1024 B). El servidor tiene `prueba.txt` (230 B), `test.txt` (450 B) y `foto.jpg` (1236 B). Secuencia dibujada:
```
[Establecimiento de conexión TCP]
C → S  RRQ prueba.txt
S → C  ACK
S → C  DATA prueba.txt (1)
C → S  WRQ fichero1.txt
S → C  ACK
C → S  DATA fichero1.txt (1)
S → C  ACK
C → S  DATA fichero1.txt (2)
S → C  ACK
C → S  RRQ test1.jpg
S → C  DATA test1.jpg (1)
S → C  WRQ foto.jpg
C → S  ACK
```
</script>
<script type="text/markdown" id="sol-3.2">
## Errores
1. **No hay conexión TCP:** TFTP usa UDP (puerto 69).
2. **RRQ prueba.txt → ACK:** a un RRQ se responde directamente con **DATA 1**, no con un ACK.
3. **Falta el ACK 1** del cliente tras el DATA de prueba.txt (230 B, un único bloque).
4. Los DATA **no llevan el nombre** del fichero, solo el número de bloque. Los ACK deben llevar su número (ACK 0 tras el WRQ, ACK 1, ACK 2…).
5. **fichero1.txt (1024 B):** falta un **DATA 3 de 0 bytes** y su **ACK 3**, porque el tamaño es múltiplo de 512.
6. **RRQ test1.jpg:** el servidor no tiene ese fichero, así que debe responder **ERROR código 1 (File not found)**.
7. **WRQ foto.jpg desde el servidor:** las peticiones (RRQ y WRQ) las hace siempre el **cliente**. Además, el cliente no tiene foto.jpg y el servidor ya la tiene: si el cliente la intentara escribir, recibiría **ERROR 6 (File already exists)**. El ACK final del cliente también sobra.
</script>

<script type="text/markdown" id="enu-3.3">
teclix.dte.us.es. tiene un servidor TFTP. Un cliente quiere **guardar** el fichero de texto `apuntesRC.txt` (**1534 B**) en el servidor.
</script>
<script type="text/markdown" id="sol-3.3">
## a)
**UDP**, al **puerto 69** del servidor.

## b)
1534 = 512 + 512 + **510**.
```
C → S  WRQ  [02 | apuntesRC.txt | 0 | netascii | 0]
S → C  ACK  [04 | 0]          (permiso para escribir)
C → S  DATA [03 | 1 | 512 B]
S → C  ACK  [04 | 1]
C → S  DATA [03 | 2 | 512 B]
S → C  ACK  [04 | 2]
C → S  DATA [03 | 3 | 510 B]  *
S → C  ACK  [04 | 3]
```
**\*** El DATA 3 es el último porque mide 510 B, **menos de 512**.
</script>

{id:"czona",t:"dns",title:"Busca los errores en la zona",
 intro:"Fichero de zona de redes.edu. tal como lo ha escrito el administrador:",
 code:`$ORIGIN redes.edu.
$TTL 3600
@     IN SOA ns1.redes.edu. admin.redes.edu. (
          2026110301 ; Serial
          3600       ; Refresh
          600        ; Retry
          86400      ; Expire
          300 )      ; Minimum
@     IN NS  ns1
@     IN NS  ns2.redes.edu
@     IN MX  10 correo.redes.edu.
ns1   IN A   10.0.0.1
web   IN A   10.0.0.20
www   IN CNAME web`,
 qs:[
  q("cza","dns","¿Cómo interpreta el servidor “ns2.redes.edu”, sin punto final?",["*Como ns2.redes.edu.redes.edu.","Como ns2.redes.edu.","Como ns2.","Da error de sintaxis"],"Sin punto final se le añade el $ORIGIN."),
  q("czb","dns","¿Es correcto “@ IN NS ns1”?",["*Sí: se completa como ns1.redes.edu.","No: falta el punto final","No: un NS debe ser siempre un FQDN","No: @ no vale en un NS"],"Un nombre relativo es válido si el resultado es el que quieres."),
  q("czc","dns","¿Qué falta para que funcione el correo?",["*Un registro A para correo.redes.edu.","Un PTR","Un segundo MX","Nada"],"El MX apunta a un nombre, y ese nombre necesita su A."),
  q("czd","dns","¿Cuál es el correo del administrador?",["*admin@redes.edu","admin.redes.edu@redes.edu","ns1@redes.edu","root@redes.edu"],"En el SOA, el primer punto equivale a la @."),
  q("cze","dns","¿Qué significa el 300 del campo Minimum?",["*Las respuestas negativas se guardan 300 s en caché","El secundario se actualiza cada 300 s","Es el TTL de todos los registros","Es el tiempo máximo sin contactar con el principal"],"El TTL general lo fija $TTL."),
  q("czf","dns","Tras corregir los errores, ¿qué más hay que tocar en el SOA?",["*Incrementar el Serial","Incrementar el Minimum","Reducir el Expire","Nada"],"Si no, los secundarios no se enteran del cambio."),
  q("czg","dns","¿Es correcto “www IN CNAME web”?",["*Sí: www.redes.edu. es alias de web.redes.edu.","No: un CNAME debe apuntar a una IP","No: falta el punto en www","No: un alias no puede apuntar a un nombre relativo"],"web existe y tiene su A.")
 ]},

const $app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inl(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\\\*/g,"*")}
function md(src){
  const lines=src.replace(/^\n+|\s+$/g,"").split("\n"); let h="",pre=null,list=null;
  const close=()=>{if(list){h+=`</${list}>`;list=null}};
  for(const raw of lines){
    if(raw.trim().startsWith("```")){ if(pre){h+=`<pre>${esc(pre.join("\n"))}</pre>`;pre=null}else{close();pre=[]} continue; }
    if(pre){pre.push(raw);continue}
    const line=raw.trim();
    if(line.startsWith("## ")){close();h+=`<h3>${inl(line.slice(3))}</h3>`}
    else if(/^- /.test(line)){ if(list!=="ul"){close();h+="<ul>";list="ul"} h+=`<li>${inl(line.slice(2))}</li>` }
    else if(/^\d+\.\s/.test(line)){ if(list!=="ol"){close();h+="<ol>";list="ol"} h+=`<li>${inl(line.replace(/^\d+\.\s/,""))}</li>` }
    else if(line===""){close()}
    else {close();h+=`<p>${inl(line)}</p>`}
  }
  close(); if(pre) h+=`<pre>${esc(pre.join("\n"))}</pre>`;
  return h;
}

function simulacro(){
  const pick=(arr,n)=>shuffle(arr).slice(0,n);
  const dnsT=Q.filter(x=>x.t==="dns").map(x=>ALL[x.id]);
  const dnsC=[...BOL.filter(b=>b.t==="dns").flatMap(b=>b.qs),...EXTRA.filter(c=>c.t==="dns").flatMap(c=>c.qs)].map(x=>ALL[x.id]);
  const ldap=poolByTema("ldap"), ftp=poolByTema("ftp");
  const items=[...pick(dnsT,5),...pick(dnsC,7),...pick(ldap,4),...pick(ftp,4)];
  start(shuffle(items),"Simulacro",null,true);
}
function show(){
  const it=ses.items[ses.i], x=it.qq, n=ses.items.length;
  const pct=Math.round(ses.i/n*100);
  const ctx=it.ctx?`<details class="case" ${ses.exam?"":"open"}><summary>${esc(it.ctx.title)}</summary><div class="prose">${it.ctx.html()}</div></details>`:"";
  const answered=it.pick!==null, reveal=answered&&!ses.exam;
  const opts=it.order.map((oi,k)=>{
    let cls="opt";
    if(reveal){ if(oi===x.a) cls+=" right"; else if(oi===it.pick) cls+=" wrong"; }
    else if(answered && oi===it.pick) cls+=" chosen";
    return `<button class="${cls}" data-oi="${oi}" ${answered?"disabled":""}><span class="let">${L[k]}</span><span>${esc(x.o[oi])}</span></button>`;
  }).join("");
  const good=answered&&it.pick===x.a;
  const fb=reveal?`<div class="fb ${good?"":"bad"}" role="status"><b>${good?"Correcto":"No es esa. La buena: "+esc(x.o[x.a])}</b>${esc(x.e)}</div>`:"";
  $app.innerHTML=`
  <div class="top">
    <div class="toprow"><button class="ghost" data-act="salir">‹ Salir</button><span class="count">${ses.exam?`<span id="clock">${fmt(ses.end-Date.now())}</span> · `:""}${ses.i+1} / ${n}${ses.exam?"":" · "+ses.ok+" ✓"}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
  </div>
  ${ctx}
  <div class="card">
    <div><span class="chip">${TEMAS[x.t]}</span></div>
    <p class="qtext">${esc(x.q)}</p>
    <div class="opts">${opts}</div>
    ${fb}
  </div>
  ${answered?`<button class="btn primary next" data-act="next"><strong>${ses.i+1<n?"Siguiente":"Ver resultado"}</strong>${arrow}</button>`:""}
  ${ses.exam&&!answered?`<button class="ghost" data-act="skip">Dejar en blanco</button>`:""}`;
  $app.querySelector('[data-act="salir"]').onclick=()=>{ if(timer){clearInterval(timer);timer=null} ses.back?ses.back():home(); window.scrollTo(0,0); };
  if(!answered) $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
  else $app.querySelector('[data-act="next"]').onclick=next;
  const sk=$app.querySelector('[data-act="skip"]'); if(sk) sk.onclick=()=>{it.pick=-1; next();};
}
function answer(oi){
  const it=ses.items[ses.i]; if(it.pick!==null) return;
  it.pick=oi; const ok=oi===it.qq.a; if(ok) ses.ok++;
  record(it.qq.id,ok);
  const y=window.scrollY; show(); window.scrollTo(0,y);
  const target=$app.querySelector(".fb")||$app.querySelector('[data-act="next"]'); if(target&&target.scrollIntoView) target.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ if(ses.i+1<ses.items.length){ses.i++;show();window.scrollTo(0,0)} else finish(); }
function finish(){
  if(timer){clearInterval(timer);timer=null}
  const n=ses.items.length, bad=ses.items.filter(it=>it.pick!==it.qq.a);
  let head;
  if(ses.exam){
    const right=ses.ok, wrong=ses.items.filter(it=>it.pick!==null&&it.pick>=0&&it.pick!==it.qq.a).length, blank=n-right-wrong;
    const nota=right/n*10, notaPen=Math.max(0,(right-wrong/3)/n*10);
    if(S.best==null||nota>S.best){S.best=nota;save()}
    const per=Object.keys(TEMAS).map(t=>{const its=ses.items.filter(i=>i.qq.t===t);const ok=its.filter(i=>i.pick===i.qq.a).length;return `<span class="k">${TEMAS[t]}</span><div class="bar" aria-hidden="true"><i style="width:${its.length?Math.round(ok/its.length*100):0}%"></i></div><span class="n">${ok}/${its.length}</span>`}).join("");
    head=`<header class="hero"><span class="label">Simulacro</span><div class="score">${nota.toFixed(1).replace(".",",")}</div>
      <p>${right} bien · ${wrong} mal · ${blank} en blanco. Con penalización de −1/3 por fallo: <strong>${notaPen.toFixed(1).replace(".",",")}</strong>.</p></header>
      <section class="section"><span class="label">Por tema</span><div class="zone">${per}</div></section>`;
  } else {
    const msg=ses.ok===n?"Todas bien.":ses.ok/n>=0.7?"Bien. Repasa las falladas.":"Toca repasar: mira las explicaciones de abajo.";
    head=`<header class="hero"><span class="label">${esc(ses.label)}</span><div class="score">${ses.ok}/${n}</div><p>${msg}</p></header>`;
  }
  $app.innerHTML=head+`
  <section class="section">
    ${bad.length?btn('data-act="rep"',`Repetir las ${bad.length} falladas`,"",true):""}
    ${ses.back?btn('data-act="back"',"Volver",""):""}
    ${btn('data-go="home"',"Volver al inicio","")}
  </section>
  ${bad.length?`<section class="section"><span class="label">Falladas y en blanco</span><div class="review">${bad.map(it=>`<div class="item"><span><span class="chip">${TEMAS[it.qq.t]}</span>${it.ctx?` <span class="sub">${esc(it.ctx.title)}</span>`:""}</span><strong>${esc(it.qq.q)}</strong><span class="ans">${esc(it.qq.o[it.qq.a])}</span><span class="exp">${esc(it.qq.e)}</span></div>`).join("")}</div></section>`:""}`;
  wireGo();
  const r=$app.querySelector('[data-act="rep"]'); if(r) r.onclick=()=>start(bad.map(it=>({qq:it.qq,ctx:it.ctx})),"Repetir falladas",ses.back);
  const bk=$app.querySelector('[data-act="back"]'); if(bk) bk.onclick=()=>{ses.back();window.scrollTo(0,0)};
  window.scrollTo(0,0);
}

/* Teclado: 1-4 para responder, Enter para seguir */
document.addEventListener("keydown",e=>{
  if(!ses||!$app.querySelector(".card")) return;
  const it=ses.items[ses.i];
  if(it.pick===null && /^[1-4]$/.test(e.key)){const k=+e.key-1; if(k<it.order.length) answer(it.order[k]);}
  else if(it.pick!==null && e.key==="Enter"){e.preventDefault(); next();}
});

home();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}

</script>
</body>
</html>
