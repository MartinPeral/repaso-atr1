<script type="text/markdown" id="ficha-dns">
## Paradigmas
- **Cliente-servidor:** servidor siempre activo con IP fija. Problema: cuello de botella. Puede haber servidores de respaldo y de apoyo.
- **P2P:** sin servidor; los pares hablan entre sí. Problema: difícil de gestionar.
- **Híbrido:** el servidor solo localiza a los pares (chat, VoIP).

## Sistemas de nombres
- **Plano:** sin estructura, administración centralizada, nombres únicos, poco escalable (el Internet inicial).
- **Jerárquico:** con estructura, distribuido, el mismo nombre en ramas distintas; cada servidor gestiona su ámbito.

## Qué es DNS
- Servicios: nombre ↔ IP, alias y reparto de carga (varias IP para un nombre).
- Define: espacio de nombres jerárquico, organización burocrática, protocolo de aplicación y base de datos distribuida.

## Espacio de nombres
- Árbol invertido. La raíz tiene etiqueta vacía (".").
- Etiqueta: **máx. 63 caracteres**. Árbol: **máx. 127 niveles**.
- Misma etiqueta permitida si **no son hermanos**.
- **FQDN:** nombre absoluto terminado en punto (`www.dte.us.es.`).

## Burocracia
- **Raíz:** 13 servidores (a–m). Los coordina **IANA**, que crea y elimina TLD pero no los gestiona.
- **TLD:** gTLD (.com .net .org libres; .edu .gov .mil restringidos; .cat .info patrocinados), ccTLD (.es…), **.arpa** (inversa), reservados (.test .example .invalid .localhost).
- **Autoritativos:** los de cada organización.
- **Registry** mantiene un TLD · **registrador** es el intermediario · **registrant** es el dueño · **whois** lo aloja el registry y lo actualiza el registrador.
- **Delegación:** el padre solo guarda a quién preguntar (NS + A si hace falta).
- **Zona** = lo que gestiona una entidad. **Dominio** = el subárbol entero.
- **Master** tiene los datos originales; **slave** guarda una copia.

## Resolución
- Host → DNS por defecto: **recursiva**. DNS por defecto → jerarquía: **iterativas**.
- Raíz y TLD **no aceptan recursivas** (tendrían que reservar recursos).
- Si el DNS por defecto es autoritativo, responde con sus mapas. Si no, mira la caché y, si no lo tiene, recorre la jerarquía.

## Caché y TTL
- Guarda la respuesta y los servidores que intervinieron, cada línea durante su **TTL**.
- TTL pequeño → más carga. TTL grande → posibles incoherencias.

## Registros
- **SOA:** servidor principal + correo del admin (1.er punto = @) + Serial (YYYYMMDDnn) · Refresh · Retry · Expire · Minimum (**TTL negativo**).
- **NS:** servidores DNS, sin orden, pueden estar en otros dominios.
- **MX:** correo; se usa primero el de **número menor**.
- **A:** nombre → IP. **CNAME:** alias → nombre canónico. **PTR:** IP → nombre en `in-addr.arpa` (IP al revés).
- `$ORIGIN` es el dominio por defecto, `@` lo sustituye y un nombre **sin punto final** recibe el $ORIGIN detrás.

## Mensaje DNS
Consulta · Respuestas · Autoridad · Adicional.

## Pila de una consulta
DNS / **UDP 53** / IP / Ethernet. El cliente se identifica por su puerto origen, su IP y su MAC.
</script>

<script type="text/markdown" id="ficha-ldap">
## Servicio de directorio
- Administra y organiza recursos y usuarios de una red.
- Optimizado para **consultas** (usa caché), distribuido, extensible, con búsquedas avanzadas y replicación.

## LDAP
- RFC 4510–4519: **4511 protocolo**, **4512 modelos**, 4513 seguridad, **4519 esquema**. Versión **3**.
- Basado en **X.500**, pero sobre **TCP/IP** (no OSI) y con menos operaciones.
- Cliente-servidor: **DUA** (cliente) y **DSA** (servidor).
- No dice cómo se almacena la información: es transparente para el cliente.
- Dos modelos: **información** y **protocolo**.

## Modelo de información
- **DIB:** toda la información. Cada DSA gestiona un trozo.
- **Entrada:** unidad básica. Puede ser objeto o **alias** (nombre alternativo).
- **Atributo:** descripción + valores. No puede haber dos valores equivalentes ("john" = "JOHN" en givenName).
- **Tipo de atributo:** sintaxis, si es multivaluado, reglas de comparación y si es de usuario u operacional. Se identifica con un **OID**.
- **Clase de objeto:** atributos **requeridos** y **permitidos**, se identifica con un OID y **hereda** de sus superclases.
- **Esquema:** impide clases subordinadas incorrectas, atributos no permitidos y valores con sintaxis mala.

## DIT y nombres
- **DIT:** el DIB organizado en árbol.
- **RDN:** pares atributo=valor (se pueden unir con `+`), **único entre hermanos**.
- **DN:** los RDN desde la entrada hasta la raíz, **único en todo el DIT**.
- Profundidad **mínima**: el dominio puede ser un único nodo (`dc=us,dc=es`).

## Administrativo y operacional
- **objectClass:** está en todas las entradas; se puede modificar pero **no borrar**.
- **Atributos operacionales:** no se devuelven salvo que se pidan. Ejemplos: creatorsName, createTimestamp, modifiersName, modifyTimestamp.
- **Contexto de nombre:** subárbol de un único DSA maestro; su prefijo es el DN del nodo inicial.
- Copias: servidores shadowing o caching.

## Protocolo
- **TCP 389**. Operaciones independientes y atómicas; no hace falta que sean síncronas.
- Operaciones: Bind, Unbind, Unsolicited notification, Search, Modify, Add, Delete, Modify DN, Compare, Abandon, Start TLS y Extended.
- Respuesta: **un solo código** de resultado, diagnosticMessage (texto libre, puede ir vacío) y matchedDN.
- **Referral:** "yo no, pero prueba aquí" (al menos una URI). No aparece en Unbind ni en Abandon. El cliente debe evitar bucles.
</script>

<script type="text/markdown" id="ficha-ftp">
## TFTP (RFC 1350)
- **UDP 69**. Simple y no fiable, sin carpetas ni cifrado. Para ficheros pequeños.
- Opcodes: **1 RRQ · 2 WRQ · 3 DATA · 4 ACK · 5 ERROR**.
- RRQ y WRQ: nombre, 0, modo (**netascii** u **octet**), 0 y opciones.
- RRQ → **DATA 1** o ERROR. WRQ → **ACK 0** o ERROR.
- DATA: número de bloque (1–65535) + **0–512 bytes**. ACK: solo el número de bloque.
- Último bloque: **menos de 512 bytes**. Si el tamaño es múltiplo de 512 → DATA final de **0 bytes**.
- Perder un mensaje = retransmitir todo el fichero.
- Errores: 0 no definido · **1 File not found** · **2 Access violation** · 3 Disk full · **6 File already exists**.

## Cuenta de mensajes
- N bloques de datos = ⌊tamaño/512⌋ + 1.
- **Lectura:** RRQ + N DATA + N ACK.
- **Escritura:** WRQ + ACK 0 + N DATA + N ACK.

## FTP (RFC 959)
- **TCP**, dos conexiones: **control 21** y **datos 20** (activo).
- **Activo:** el **servidor** abre los datos desde el puerto 20.
- **Pasivo:** el cliente manda **PASV**, el servidor responde **PORT** con un puerto y el **cliente** abre los datos.
- Se negocian el puerto de datos, el modo (activo o pasivo) y la transferencia (ASCII o binario).
- Comandos del protocolo: USER, PASS, LIST, **RETR** (bajar), **STOR** (subir).
- Comandos del cliente: cd, get, put, mkdir, exit.
- Respuestas: **331** falta la contraseña · **125** empieza la transferencia · **425** no se abre la conexión de datos · **452** error al escribir.
- Configuración: puertos, máximo de conexiones (total y por IP), timeout, mensajes, usuarios y anónimos, grupos, permisos rwx, ancho de banda y logs.
</script>

<script type="text/markdown" id="reglas">
## 1. Lee el nombre de derecha a izquierda
`www.a2.rediris.com.` → raíz → com → rediris → a2 → www. Cada servidor solo conoce al siguiente.

## 2. Cada referencia es una pareja NS + A
- **NS:** quién lleva el dominio. **A:** dónde está ese servidor.
- El A (glue) es imprescindible si el servidor está **dentro** del dominio que se delega.
- La respuesta final es solo un A (o un CNAME + A).

## 3. Recursiva arriba, iterativas abajo
- Cliente → DNS por defecto: recursiva.
- DNS por defecto → raíz, TLD y autoritativos: iterativas.
- Raíz y TLD no aceptan recursivas: si te los ponen como DNS por defecto, solo dan una referencia.

## 4. Solo guarda caché quien resuelve
El DNS por defecto. Los que reciben iterativas responden con sus propios datos y no aprenden nada.

## 5. Para una consulta nueva con caché
1. ¿Está vivo el registro final (TTL > tiempo transcurrido)? Se responde desde la caché.
2. Si no, busca el **NS vivo más cercano** al nombre **que además tenga vivo su A**.
3. Si no queda ninguno, empieza por la raíz.
Un A vivo sin su NS no sirve: no sabes qué dominio lleva ese servidor.

## 6. Reconstruir el viaje desde una caché
- El único A que no es de un servidor DNS es lo que se preguntó.
- Si no hay NS de un nivel, el servidor era **autoritativo** de ese nivel.
- Paquete de respuesta: **origen = servidor**, **destino = cliente**.

## 7. ¿Quién es esa IP?
Antes de contestar, identifica la IP: ¿un DNS por defecto, un autoritativo, un TLD o un cliente? Si te dicen que los DNS están en un rango (100.0.0.0/8…), una IP fuera de ese rango **no es un DNS**.

## 8. ¿Autoritativa o no?
Autoritativa si responde un servidor **de la zona** (primario o secundario). Si responde desde la caché, no lo es ("Non-authoritative answer").

## 9. Tiempos que preguntan
- Cambio de un registro: los secundarios lo copian en **Refresh** + las cachés lo guardan su **TTL**. Máximo: Refresh + TTL.
- Respuesta negativa en caché: dura el **Minimum** del SOA.
- El primario parado: el secundario responde hasta **Expire**, y no se pueden hacer cambios (se hacen en el primario).

## 10. Añadir un dominio
- **Padre:** NS + A (glue) del nuevo servidor.
- **Zona nueva:** SOA, NS, A del servidor, MX y A del correo.
- Un host nuevo en una zona que ya existe: solo su A en esa zona.
- Un alias va en la zona **del alias**. Un PTR, en la zona inversa de la IP (al revés).

## 11. Errores típicos en ficheros de zona
- Nombre **sin punto final** → se le pega el $ORIGIN.
- Registros de **otra zona** metidos en esta.
- MX o NS que apuntan a nombres **sin A**.
- SOA con un primario que no aparece en los NS.
- Erratas entre el NS y su A (severA ≠ serverA).
- Un espacio dentro de un nombre ("serverd. enero…").

## 12. Cómo redactarlo en el examen
- **Resolución:** una línea por mensaje, con el formato *n. Origen → Destino (recursiva o iterativa): pregunta → respuesta (NS + A, o A final)*.
- **Caché:** en formato de registro, `nombre TTL IN TIPO valor`, una pareja NS + A por cada nivel y la respuesta final.
- **Añadir algo:** "En la zona X (servidor Y) se añade:" y debajo los RR completos, con punto final.
- **Tiempos:** justifica siempre con números. Por ejemplo: "el NS de fedempes (800) sigue vivo en t = 700, así que…".
- **Nombres o IP que no te dan:** server_xxxx, IP_server_xxxx o dnsp_zona, según lo que pida el enunciado.
- **¿Autoritativa?** Di quién responde y por qué es o no dueño de la zona.

<script type="text/markdown" id="enu-3.1">
El host A quiere **mandar** el fichero `prueba.txt`, de **1024 bytes**, por TFTP. Escribe los mensajes entre cliente y servidor.
</script>
<script type="text/markdown" id="sol-3.1">
Mandar = escribir → **WRQ**. 1024 = 512 + 512 + **0** (es múltiplo de 512, así que va un último DATA vacío).
```
C → S  WRQ  [02 | prueba.txt | 0 | netascii | 0]
S → C  ACK  [04 | 0]
C → S  DATA [03 | 1 | 512 B]
S → C  ACK  [04 | 1]
C → S  DATA [03 | 2 | 512 B]
S → C  ACK  [04 | 2]
C → S  DATA [03 | 3 | 0 B]   ← último (< 512)
S → C  ACK  [04 | 3]
```
En total, 8 mensajes.
</script>

<script type="text/markdown" id="enu-3.2">
Cronograma TFTP con errores. El cliente tiene `fichero1.txt` (1024 B). El servidor tiene `prueba.txt` (230 B), `test.txt` (450 B) y `foto.jpg` (1236 B). Secuencia dibujada:
```
[Establecimiento de conexión TCP]
C → S  RRQ prueba.txt
S → C  ACK
S → C  DATA prueba.txt (1)
C → S  WRQ fichero1.txt
S → C  ACK
C → S  DATA fichero1.txt (1)
S → C  ACK
C → S  DATA fichero1.txt (2)
S → C  ACK
C → S  RRQ test1.jpg
S → C  DATA test1.jpg (1)
S → C  WRQ foto.jpg
C → S  ACK
```
</script>
<script type="text/markdown" id="sol-3.2">
## Errores
1. **No hay conexión TCP:** TFTP usa UDP (puerto 69).
2. **RRQ prueba.txt → ACK:** a un RRQ se responde directamente con **DATA 1**, no con un ACK.
3. **Falta el ACK 1** del cliente tras el DATA de prueba.txt (230 B, un único bloque).
4. Los DATA **no llevan el nombre** del fichero, solo el número de bloque. Los ACK deben llevar su número (ACK 0 tras el WRQ, ACK 1, ACK 2…).
5. **fichero1.txt (1024 B):** falta un **DATA 3 de 0 bytes** y su **ACK 3**, porque el tamaño es múltiplo de 512.
6. **RRQ test1.jpg:** el servidor no tiene ese fichero, así que debe responder **ERROR código 1 (File not found)**.
7. **WRQ foto.jpg desde el servidor:** las peticiones (RRQ y WRQ) las hace siempre el **cliente**. Además, el cliente no tiene foto.jpg y el servidor ya la tiene: si el cliente la intentara escribir, recibiría **ERROR 6 (File already exists)**. El ACK final del cliente también sobra.
</script>

<script type="text/markdown" id="enu-3.3">

<script type="text/markdown" id="sol-3.3">
## a)
**UDP**, al **puerto 69** del servidor.

## b)
1534 = 512 + 512 + **510**.
```
C → S  WRQ  [02 | apuntesRC.txt | 0 | netascii | 0]
S → C  ACK  [04 | 0]          (permiso para escribir)
C → S  DATA [03 | 1 | 512 B]
S → C  ACK  [04 | 1]
C → S  DATA [03 | 2 | 512 B]
S → C  ACK  [04 | 2]
C → S  DATA [03 | 3 | 510 B]  *
S → C  ACK  [04 | 3]
```
**\*** El DATA 3 es el último porque mide 510 B, **menos de 512**.
</script>

<!-- ===================== EXÁMENES ANTERIORES ===================== -->
<script type="text/markdown" id="ap-1">
## LDAP
- **Modelos:** de **información** (qué se guarda: entradas, atributos, clases, esquema, DIT) y de **protocolo** (cómo hablan DUA y DSA).
- **Modelo de protocolo:** cliente-servidor (DUA y DSA), **TCP 389**. Peticiones y respuestas, independientes y atómicas, no síncronas. Mensajes: peticiones (Bind, Search, Add…), respuestas (código + referral) y notificaciones.
- **Esquema:** las reglas de las entradas (clases, atributos, sintaxis). Impide clases, atributos o sintaxis incorrectos.
- **Atributo operacional:** lo pone el servidor (`creatorsName`, `modifyTimestamp`…) y no sale en una búsqueda salvo que se pida. Ejemplo: la fecha de la última actualización.

## DNS
- **Refresh:** cada cuánto se actualiza el secundario.
- **Retry:** cada cuánto reintenta si ha fallado.
- **Expire:** el máximo sin contactar con el primario.
- **Minimum:** el TTL de las respuestas negativas.
- **Nombre a partir de una IP:** PTR con la IP al revés en `in-addr.arpa`, en el servidor de su zona inversa, con las delegaciones desde los padres.

## TFTP
- **Número de DATA:** ⌊tamaño/512⌋ + 1 (si es múltiplo de 512, el último va con 0 bytes).
- **Escritura:** WRQ + ACK 0 + N DATA + N ACK. **Lectura:** RRQ + N DATA + N ACK.
- **Ejemplo, 2560 B:** 6 DATA y 7 ACK.
- **Fin del nombre del fichero:** un byte a 0.
- **Número de bloque:** ordena los datos (UDP no lo hace) y dice qué confirma cada ACK. Ocupa 2 bytes.

## FTP
- **Activo:** control del cliente al 21; los datos los abre el servidor desde el 20.
- **Pasivo:** PASV, el servidor responde con PORT y el cliente abre los datos.
- **Modos de transferencia:** ASCII (texto) y binario (bytes tal cual).
- **Descargar un fichero:** `RETR fichero`, por la conexión de control (21).

## TFTP frente a FTP
TFTP: UDP 69, sin usuarios ni carpetas; la fiabilidad la ponen los números de bloque y los ACK. FTP: TCP con dos conexiones (control 21 y datos 20), con usuarios, contraseñas y directorios.
</script>

<script type="text/markdown" id="ap-2">
## Ideas clave
- **RDN** = nombre dentro de su carpeta → **único entre hermanos**.
- **DN** = ruta completa, de la hoja a la raíz → único en todo el DIT.
- Mismo RDN con **otro padre** → sí se puede.
- Si algo se repite entre hermanos → combinar atributos con **`+`**.
- Atributo que **no está en el RDN** → puede tener **varios valores**.
- Profundidad **mínima** → todos los `dc` juntos son **un solo nodo**.

## Método para dibujar el DIT
1. Raíz: el dominio (`dc=…`).
2. Carpetas `ou` (organizationalUnit): los grupos del enunciado.
3. Hojas: las personas o cosas.
4. RDN de las hojas: mira qué se repite en los ejemplos.
5. "¿Se puede añadir…?": construye su RDN y compáralo con sus hermanos.

## Resumen de los parciales
- **24-25, Proyectos:** raíz → tipo → subtipo → proyecto, con 4 DSA. El acrónimo y el código se repiten por separado → RDN `ac=…+cod=…`. ¿Dos IP? Sí. ¿Proyecto nuevo? No puede repetir acrónimo **y** código.
- **23-24 A, Empresa:** raíz → departamento → ciudad → `sn=…`. ¿Teléfono del departamento? Sí, en su nodo `ou`. ¿Antonio Romero en Diseño? En Almería no (ya hay `sn=Romero`); en otra ciudad sí.
- **23-24 B, Tiendas:** raíz → tienda → departamento → sección → producto (`id+marca`). ¿El mismo producto en dos departamentos? Sí. ¿Stock de una marca y modelo? 3 hojas, una por tienda. ¿El mismo id con marca nueva? Sí.
</script>

<script type="text/markdown" id="ap-3">
## Paso 0: quién es quién (siempre lo primero)
- Haz una tabla: **estación → su DNS → qué es** (primario, secundario, DNS normal, TLD, un cliente…).
- **Paquete de respuesta:** origen = **servidor**, destino = **cliente**.
- **Servidor que no guarda nada en caché** al responder → es **autoritativo** de esa zona.
- **Primario** = el primer nombre del SOA. Otro autoritativo de la misma zona = **secundario** (una copia).
- **IP fuera del rango reservado** para los DNS → **no es un DNS**: no hay respuesta.
- Sin NS de un subdominio en la caché → **no está delegado** (es parte de la zona padre).

## Resoluciones
- Cliente → su DNS: **recursiva**. Su DNS → jerarquía: **iterativas**.
- Empieza por el **NS vivo más cercano** que tenga su **A vivo**. Si no queda ninguno, la raíz.
- Cuenta el TTL **desde que se guardó**, no desde t = 0.
- Si un servidor está apagado, se prueba el otro NS. Si está fuera del dominio, **su IP no viene como glue** y hay que resolverla aparte.

## Tiempos
- **Secundario:** solo ve los cambios cuando hace **refresh**. Si el primario está apagado, falla y lo reintenta cada **retry**. La actualización tarda lo que diga el enunciado.
- **Respuesta negativa** → el DNS que no es autoritativo la guarda en caché durante el **Minimum**.
- **Cambio de IP:** como máximo, Refresh (el secundario) + TTL (las cachés).
- **Alias (CNAME):** primero se resuelve el alias y luego el nombre real. Cuenta cuándo sabe cada servidor el nombre real.
- Escribe siempre la suposición que hagas (por ejemplo, "cuento el refresh desde que terminó la última actualización").

## Añadir registros
- Host nuevo → solo su **A** en la zona que lo contiene, en el **primario**.
- Fichero de zona → solo los nombres que **terminan en esa zona**.
- Padre de una zona → solo **NS + A (glue)** de los servidores que están dentro del hijo.

## Quién es quién
- **A → 100.1.32.22 = mserver.teo.atr1.edu**: es NS de teo, pero no el primario del SOA (server2) → **secundario, autoritativo** de teo.atr1.edu.

- **C → 100.1.23.23 = dns-prim.teo.atr1.edu**: es un DNS (está en 100.1/16), pero **no aparece en los NS de teo** → **no es autoritativo**, a pesar del nombre.

## a) www.teo.atr1.edu.
- **A:** sí. mserver responde con sus datos (150.210.12.7) → **autoritativa**.

## b) miserv-secret.teo.atr1.edu. (1200 s después)
**Desde A (mserver):**
1. maqA → mserver.teo.atr1.edu (recursiva).
2. mserver tiene en sus datos `miserv-secret CNAME fdem.aux.exam.es.` Necesita el A de fdem, que no es de su zona, y no tiene caché (en a respondió con sus datos).
3. mserver → raíz (iterativa): `es. NS dns-server-1.es.` + A.
4. → dns-server-1.es.: `exam.es. NS ns-serv.exam.es.` y `NS servns.exam.es.` + A (100.1.7.25 y 100.1.8.14).
5. → ns-serv.exam.es.: `fdem.aux.exam.es. A 140.40.30.7` (autoritativa).
6. mserver → maqA: el CNAME y el A 140.40.30.7.

**Desde B (ns-serv):** en a guardó la respuesta autoritativa de teo, con sus NS y A. A los 1200 s siguen vivos el **NS de server2 (2000)** y su **A (1500)**; el A de mserver (1000) y los NS de pserver y secserver (1000) han caducado.
1. maqB → ns-serv.exam.es (recursiva).
2. ns-serv → **server2.teo.atr1.edu** (100.1.3.10), directamente: `miserv-secret CNAME fdem.aux.exam.es.` (autoritativa).

<script type="text/markdown" id="sol-p2324b-3">
## La clave del problema
La caché dice que **www = 120.2.3.4**, pero esa IP es de **servftp** (`4.3.2.120.in-addr.arpa. PTR servftp`). La inversa dice que **www es 120.2.8.7** (`7.8.2.120.in-addr.arpa. PTR www`). → **El A de www en la zona teo está mal**: apunta al servidor FTP, que rechaza el HTTP.

## a) Jerarquía inversa
```
. (raíz)
└─ arpa                         ns-arpa.arpa.
   └─ in-addr.arpa              servns.in-addr.arpa.
      └─ 120.in-addr.arpa       mserv1.120.in-addr.arpa. / dnsserver.120.in-addr.arpa.
         └─ 2.120.in-addr.arpa  servdns.2.120.in-addr.arpa.
            ├─ 4.3 → PTR servftp.teo.atr1.edu.
            └─ 7.8 → PTR www.teo.atr1.edu.
```
No hay NS por debajo de 2.120, así que 3.2.120 y 8.2.120 no están delegados: los PTR están en la zona 2.120.in-addr.arpa.

## b) Qué cambiar
En la zona **teo.atr1.edu.**, en su **primario ns2.atr1.edu.** (el del SOA), corregir el A y subir el serial:
```
www.teo.atr1.edu. IN A 120.2.8.7
```

## c) ¿DNS por defecto = 120.20.32.33?
**No.** 120.20.32.33 es **ns2.atr1.edu**, el **primario de teo**. Si lo fuera, habría respondido con sus datos y **no tendría en caché** los NS de teo ni el A de www. Tampoco es autoritativo de **2.120.in-addr.arpa.**: tiene en caché su NS y el PTR, así que los obtuvo preguntando a otros.

## d) Cambios en t = 1000
El A viejo de www está en caché hasta **t = 1100** (TTL 1100). En t = 1100 se vuelve a preguntar: el NS de teo (900) ha caducado, pero el de atr1.edu (1500) y su A (1200) siguen vivos → ns-serv.atr1.edu → referencia a teo. Si responde **ns2 (el primario)**, ya tiene el cambio. **Mínimo: 100 s** (de 1000 a 1100). Si respondiera servns (el secundario), habría que esperar a su refresh.

## e) Segunda consulta (PTR de 120.2.3.4)
1. maqA → DNS por defecto (recursiva): ¿PTR 4.3.2.120.in-addr.arpa.?
2. → raíz (iterativa): `arpa. NS ns-arpa.arpa.` + A.
3. → ns-arpa.arpa.: `in-addr.arpa. NS servns.in-addr.arpa.` + A.
4. → servns.in-addr.arpa.: `120.in-addr.arpa. NS mserv1…` y `NS dnsserver…` + A.
5. → mserv1.120.in-addr.arpa.: `2.120.in-addr.arpa. NS servdns.2.120.in-addr.arpa.` + A.
6. → servdns.2.120.in-addr.arpa.: `4.3.2.120.in-addr.arpa. PTR servftp.teo.atr1.edu.` (autoritativa).
7. DNS por defecto → maqA.

## f) Secundario m2serv.teo.atr1.edu. (120.2.70.75)
- En **teo.atr1.edu.** (primario ns2.atr1.edu.), subiendo el serial:
```
teo.atr1.edu.          IN NS m2serv.teo.atr1.edu.
m2serv.teo.atr1.edu.   IN A  120.2.70.75
```
- En el padre **atr1.edu.** (ns-serv.atr1.edu.), la delegación más el **glue** (m2serv está dentro de teo):
```
teo.atr1.edu.          IN NS m2serv.teo.atr1.edu.
m2serv.teo.atr1.edu.   IN A  120.2.70.75
```
- En la inversa **2.120.in-addr.arpa.** (servdns.2.120.in-addr.arpa.):
```
75.70.2.120.in-addr.arpa. IN PTR m2serv.teo.atr1.edu.
```
- Y configurar m2serv como secundario que copia la zona de ns2.

q("d25","dns","En un fichero de zona, un nombre que no termina en punto…",["*Recibe el $ORIGIN detrás","Se interpreta como FQDN","Da error de sintaxis","Se completa con la raíz"],"Por eso, si te olvidas el punto, aparecen cosas como ns1.aula105.aula105."),
q("d26","dns","Sobre los registros NS de un dominio, ¿qué es cierto?",["*No tienen orden de prioridad y pueden estar en otros dominios","Se consultan en el orden en que aparecen","Deben pertenecer al mismo dominio","Solo puede haber uno por dominio"],"Además, conviene repartirlos por redes distintas. Por eso, sin el SOA no sabes cuál es el primario."),
q("d27","dns","Tras una resolución normal, ¿qué servidor guarda la información en caché?",["*El que resolvió: el que recibió la recursiva e hizo las iterativas","Todos los servidores consultados","Solo el raíz","Solo el autoritativo"],"Los que reciben iterativas responden con sus propios datos y no aprenden nada nuevo."),
q("d28","dns","¿Qué provoca un TTL muy grande?",["*Posibles incoherencias: datos viejos en caché durante mucho tiempo","Más carga en los servidores","Que los secundarios no se actualicen","Que no se pueda usar caché"],"TTL pequeño: más carga. TTL grande: riesgo de incoherencias."),
q("d29","dns","nslookup muestra “Non-authoritative answer”. ¿Qué significa?",["*Respondió un servidor que no es dueño de la zona (normalmente desde su caché)","La respuesta es falsa","El dominio no existe","El servidor autoritativo está caído"],"En la práctica, el cache-server respondía así porque había obtenido el dato del raíz y de tu servidor."),
q("d30","dns","El servidor por defecto tiene en caché (vigente) el NS de com y su A. Llega una consulta sobre algo.com. ¿Por dónde empieza?",["*Por el servidor de com, sin pasar por la raíz","Por la raíz, siempre","Por el servidor autoritativo de algo.com","Responde desde caché"],"Siempre se empieza por el NS vigente más cercano al nombre preguntado, si también tiene vigente su A."),
q("d31","dns","¿Para qué sirve el fichero root.hints (named.root)?",["*Le dice al servidor DNS cómo llegar a los servidores raíz","Guarda la caché del servidor","Define las zonas locales","Contiene la zona inversa"],"Es lo que modificaste en la práctica para apuntar al raíz del laboratorio."),
q("d32","dns","¿Qué TLD se usa para la zona inversa?",["*.arpa",".test",".invalid",".example"],".arpa (in-addr.arpa). .test es para pruebas DNS, .example para documentación e .invalid para probar servidores nuevos."),
q("d33","dns","¿Qué caracteriza a un sistema de nombres plano?",["*Administración centralizada y poca escalabilidad","Administración distribuida","Nombres repetidos en distintas ramas","Informa de la localización"],"Fue el esquema inicial de Internet: un único fichero en un nodo principal."),
q("d34","dns","¿Qué ejemplo corresponde al paradigma híbrido?",["*Chat o VoIP: el servidor solo localiza a los pares","Una web clásica","BitTorrent sin tracker","DNS"],"El servidor no da el servicio: guarda la información para encontrar a los pares, que luego se comunican P2P."),
q("d35","dns","¿Qué pila de protocolos usa una consulta DNS normal de un cliente a su servidor?",["*DNS / UDP (puerto 53) / IP / Ethernet","DNS / TCP (puerto 21) / IP / Ethernet","HTTP / TCP / IP","DNS directamente sobre IP"],"El cliente se identifica por su puerto origen (UDP), su IP y su MAC."),
q("d36","dns","En nslookup, ¿qué devuelve set query=MX y luego hotmail.com?",["*Los servidores de correo de hotmail.com","Los servidores DNS de hotmail.com","La IP de hotmail.com","El correo del administrador"],"NS da los servidores DNS. SOA da el correo del administrador."),

/* LDAP */
q("l1","ldap","En LDAP, ¿cómo se llama el servidor?",["*DSA (Directory System Agent)","DUA (Directory User Agent)","DIT","DIB"],"El cliente es el DUA y el servidor el DSA."),
q("l2","ldap","¿Qué puerto TCP usa LDAP por defecto?",["*389","69","21","53"],"El DUA abre la sesión conectándose al puerto TCP 389 del servidor."),
q("l3","ldap","¿En qué se basa LDAP y qué lo diferencia de él?",["*En X.500, pero usa TCP/IP en vez de OSI y tiene menos operaciones","En DNS, pero usa TCP","En X.500, pero usa UDP","En HTTP, pero con esquema"],"Por eso es más ligero y más simple de programar y administrar."),
q("l4","ldap","¿Qué RFC define el protocolo LDAP?",["*RFC 4511","RFC 4512","RFC 4519","RFC 959"],"4511: protocolo. 4512: modelos de información. 4519: esquema. 4513: seguridad."),
q("l5","ldap","¿Qué es el DIB?",["*Toda la información contenida en el directorio","El árbol de entradas","El cliente LDAP","El esquema"],"DIB es la información. DIT es esa información organizada en árbol."),
q("l6","ldap","¿Qué es el DIT?",["*Las entradas del DIB organizadas en árbol","Un servidor LDAP","El identificador de una entrada","Un tipo de atributo"],"Los nodos son entradas y los arcos son relaciones padre-hijo."),
q("l7","ldap","El RDN de una entrada debe ser único…",["*Entre sus hermanos (hijos del mismo padre)","En todo el DIT","En todo el DSA","No tiene por qué ser único"],"Lo que es único en todo el DIT es el DN."),
q("l8","ldap","¿Qué es el DN de una entrada?",["*La concatenación de los RDN desde la entrada hasta la raíz","El RDN de su padre","El atributo cn","El OID de su clase"],"Ejemplo: cn=Octavio Rivera, ou=personal, dc=us, dc=es."),
q("l9","ldap","¿Es válido el RDN CN=Peter García+L=Sevilla?",["*Sí: un RDN puede tener varios pares atributo=valor unidos con +","No: un RDN solo admite un atributo","Solo si L es atributo operacional","Solo en el nodo raíz"],"Sirve para desempatar cuando un solo atributo no basta para ser único entre hermanos."),
q("l10","ldap","¿Qué puede hacer un cliente con el atributo objectClass?",["*Modificar sus valores, pero no eliminarlo","Eliminarlo","Nada: es de solo lectura","Solo leerlo si lo pide explícitamente"],"Toda entrada lo tiene y especifica sus clases de objeto."),
q("l11","ldap","¿Qué es cierto de los atributos operacionales?",["*No se devuelven en una búsqueda salvo que se pidan explícitamente","Los define y gestiona el usuario","Siempre son modificables","Forman parte del RDN"],"Ejemplos: creatorsName, createTimestamp, modifiersName, modifyTimestamp."),
q("l12","ldap","¿Qué tipo de atributo es creatorsName?",["*Operacional","De usuario","Una clase de objeto","Un RDN"],"Lo usa el servidor con fines administrativos."),
q("l13","ldap","¿Qué hereda una clase de objeto de sus superclases?",["*Sus atributos requeridos y permitidos","Solo su OID","Sus entradas","Nada"],"Una entrada debe cumplir los requisitos de todas las clases a las que pertenece."),
q("l14","ldap","givenName usa Directory String, que no distingue mayúsculas. ¿Puede una entrada tener “john” y “JOHN”?",["*No: son valores equivalentes del mismo atributo","Sí, son distintos","Solo si es multivaluado","Solo si son atributos operacionales"],"No puede haber dos valores equivalentes del mismo atributo."),
q("l15","ldap","¿Qué impide el esquema?",["*Añadir a una entrada atributos no permitidos por su clase","Crear más de un DSA","Hacer búsquedas","Usar RDN multivaluados"],"También impide crear entradas subordinadas de una clase incorrecta y usar valores con la sintaxis equivocada."),
q("l16","ldap","¿Especifica LDAP cómo y dónde se almacena la información?",["*No: es transparente para el cliente","Sí: en una base de datos relacional","Sí: en ficheros LDIF","Sí: en zonas como DNS"],"Así cualquier DUA puede trabajar con cualquier implementación."),
q("l17","ldap","¿Qué indica un referral en una respuesta LDAP?",["*Que este servidor no puede hacer la operación, pero otro (indicado con una URI) podría","Que la entrada no existe en ningún sitio","Que hay que repetir la operación","Que el cliente no tiene permisos"],"Pasa si la entrada no está en local o la operación está restringida (p. ej., en una copia de solo lectura)."),
q("l18","ldap","¿En qué respuestas no puede aparecer un referral?",["*Unbind y Abandon","Bind y Search","Add y Delete","Compare y Modify"],"En el resto sí puede aparecer, y debe incluir al menos una URI."),
q("l19","ldap","Si el servidor detecta varios errores en una operación, ¿cuántos códigos devuelve?",["*Uno solo: el que mejor describe el problema","Todos","Ninguno: devuelve un referral","Uno por cada atributo afectado"],"El texto adicional va en diagnosticMessage."),
q("l20","ldap","¿Tienen que ser síncronas las operaciones LDAP?",["*No: son independientes y atómicas, y el cliente puede enviar varias sin esperar","Sí, siempre","Solo las de búsqueda","Solo si se usa Start TLS"],"Cada operación deja el directorio en un estado consistente."),
q("l21","ldap","¿Qué es un contexto de nombre?",["*Un subárbol gestionado por un único DSA maestro","El DN de la raíz","Un atributo operacional","El conjunto de DSA de copia"],"Su prefijo es el DN de su nodo inicial."),
q("l22","ldap","¿Qué es una entrada alias?",["*Un nombre alternativo para un objeto","Una copia de la entrada en otro DSA","Una subentrada administrativa","Un atributo multivaluado"],"Una entrada puede ser objeto (representa un objeto) o alias (otro nombre para él)."),
q("l23","ldap","¿Cuál de estas NO es una operación LDAP?",["*Transfer","Bind","Compare","Abandon"],"Operaciones: Bind, Unbind, Unsolicited notification, Search, Modify, Add, Delete, Modify DN, Compare, Abandon, Start TLS, Extended."),
q("l24","ldap","¿Qué es cierto del campo diagnosticMessage?",["*Es texto legible, no está estandarizado y puede ir vacío","Contiene siempre el DN buscado","Es obligatorio en toda respuesta","Lleva las URIs del referral"],"El DN de la última entrada encontrada va en matchedDN."),
q("l25","ldap","¿Cómo se identifica un tipo de atributo o una clase de objeto?",["*Con un OID y, opcionalmente, nombres cortos (descriptores)","Con su DN","Con su RDN","Con un número de puerto"],"OID = Object IDentifier."),
q("l26","ldap","En un DN, ¿qué clase de objeto suele tener un nodo como ou=Informática?",["*organizationalUnit","inetOrgPerson","person","alias"],"ou = unidad organizativa. Sirve para agrupar entradas."),

/* TFTP / FTP */
q("f1","ftp","¿Qué transporte y puerto usa TFTP?",["*UDP, puerto 69","TCP, puerto 69","TCP, puertos 20 y 21","UDP, puerto 53"],"TFTP es simple y no fiable. FTP usa TCP (21 control, 20 datos)."),
q("f2","ftp","¿Qué puertos usa FTP?",["*21 para control y 20 para datos (modo activo)","69 para todo","20 para control y 21 para datos","389"],"Dos conexiones TCP: control (órdenes) y datos (ficheros)."),
q("f3","ftp","En TFTP, ¿qué mensaje tiene opcode 04?",["*ACK","DATA","WRQ","ERROR"],"1 RRQ · 2 WRQ · 3 DATA · 4 ACK · 5 ERROR."),
q("f4","ftp","En TFTP, ¿qué mensaje tiene opcode 02?",["*WRQ (petición de escritura)","RRQ (petición de lectura)","DATA","ACK"],"WRQ sirve para subir un fichero al servidor."),
q("f5","ftp","¿Cuántos datos lleva como máximo un mensaje DATA de TFTP?",["*512 bytes","1024 bytes","1500 bytes","65535 bytes"],"Además del opcode (2 bytes) y el número de bloque (2 bytes)."),
q("f6","ftp","¿Cómo sabe el receptor que un DATA es el último?",["*Porque lleva menos de 512 bytes","Porque lleva el bloque 65535","Porque va seguido de un ERROR","Porque el opcode cambia"],"Si el fichero mide un múltiplo de 512, se envía al final un DATA de 0 bytes."),
q("f7","ftp","Se transfiere por TFTP un fichero de 1024 bytes. ¿Cuántos mensajes DATA se envían?",["*3: dos de 512 y uno de 0 bytes","2: dos de 512","1 de 1024","4"],"1024 es múltiplo de 512, así que hace falta un último DATA vacío para marcar el final."),
q("f8","ftp","¿Qué responde el servidor TFTP a un WRQ si acepta?",["*ACK con bloque 0","DATA con bloque 1","Un RRQ","Nada: el cliente empieza a enviar"],"El ACK 0 es el permiso para empezar a escribir."),
q("f9","ftp","¿Qué responde el servidor TFTP a un RRQ si todo va bien?",["*DATA con bloque 1","ACK con bloque 0","ACK con bloque 1","WRQ"],"Tras un RRQ llega un DATA o un ERROR."),
q("f10","ftp","¿Qué modo TFTP se usa para un fichero binario?",["*octet","netascii","binary","raw"],"netascii es para texto."),
q("f11","ftp","¿Qué significa el error TFTP con código 1?",["*File not found","Access violation","Disk full","File already exists"],"2 Access violation · 3 Disk full · 6 File already exists · 0 no definido."),
q("f12","ftp","¿Para qué sirve el número de bloque en TFTP?",["*Para garantizar el orden de los datos, porque UDP no lo hace","Para cifrar los datos","Para indicar el tamaño del fichero","Para elegir el puerto"],"Va de 1 a 65535."),
q("f13","ftp","Según teoría, ¿cuál es el problema de TFTP con ficheros largos?",["*Perder un mensaje obliga a retransmitir todo el fichero","No admite más de 512 bytes en total","No admite ficheros binarios","Necesita dos conexiones"],"Por eso es útil sobre todo para ficheros pequeños."),
q("f14","ftp","En FTP en modo activo, ¿quién abre la conexión de datos?",["*El servidor, desde su puerto 20 hacia el cliente","El cliente, hacia el puerto 20 del servidor","El cliente, hacia el puerto que indique PORT","Nadie: va por la conexión de control"],"En modo pasivo es al revés: la abre el cliente."),
q("f15","ftp","En FTP en modo pasivo, ¿qué ocurre?",["*El cliente envía PASV, el servidor responde con PORT y un puerto, y el cliente abre la conexión de datos","El servidor abre la conexión desde el puerto 20","Se usa UDP","Control y datos van por el puerto 21"],"Es útil cuando el cliente no acepta conexiones entrantes."),
q("f16","ftp","¿Qué comando del protocolo FTP descarga un fichero?",["*RETR","STOR","get","LIST"],"STOR sube un fichero. get es un comando de la aplicación cliente, no del protocolo."),
q("f17","ftp","¿Qué significa la respuesta FTP 331?",["*Usuario correcto, falta la contraseña","Transferencia empezando","No se puede abrir la conexión de datos","Error al escribir el fichero"],"125: empieza la transferencia. 425: no se puede abrir la conexión de datos. 452: error al escribir."),
q("f18","ftp","¿Qué diferencia hay entre get y RETR?",["*get es un comando del programa cliente; RETR es el comando del protocolo","Son lo mismo","RETR es del cliente y get del protocolo","get es para TFTP y RETR para FTP"],"El cliente traduce get a RETR por la conexión de control."),
q("f19","ftp","¿Qué es cierto de TFTP?",["*No tiene carpetas ni cifrado","Usa dos conexiones","Requiere usuario y contraseña","Usa el puerto 21"],"Es un protocolo muy simple."),
q("f20","ftp","Se sube por TFTP un fichero de 1534 bytes. ¿Cómo es el último DATA?",["*Bloque 3 con 510 bytes","Bloque 3 con 512 bytes","Bloque 4 con 0 bytes","Bloque 2 con 510 bytes"],"1534 = 512 + 512 + 510. Como 510 < 512, es el último.")
];

{id:"3.1",t:"ftp",title:"Enviar prueba.txt (1024 B)",d:2,qs:[

{id:"3.2",t:"ftp",title:"Cronograma TFTP con errores",d:4,qs:[
 q("b32a","ftp","¿Qué falla al principio del cronograma?",["*TFTP usa UDP: no hay establecimiento de conexión TCP","Falta un SYN","El RRQ debe ir al puerto 21","Nada"],"TFTP va sobre UDP, puerto 69."),
 q("b32b","ftp","¿Qué debería responder el servidor al RRQ prueba.txt?",["*DATA 1 directamente, no un ACK","Lo dibujado es correcto","ACK 1","WRQ"],"A un RRQ se responde con datos."),
 q("b32c","ftp","¿Qué falta tras el DATA de prueba.txt (230 B)?",["*El ACK 1 del cliente","Un DATA 2 de 0 bytes","Nada","Un ERROR"],"Todo DATA se confirma. Como 230 < 512, no hay más bloques."),
 q("b32d","ftp","¿Qué falta en el envío de fichero1.txt (1024 B)?",["*Un DATA 3 de 0 bytes y su ACK 3","Sobra el DATA 2","Nada","Un ACK 0 extra"],"1024 es múltiplo de 512."),
 q("b32e","ftp","¿Qué debería pasar con el RRQ test1.jpg?",["*El servidor no tiene test1.jpg: debe responder ERROR código 1 (File not found)","Lo dibujado es correcto","Debe responder ACK 0","Debe responder ERROR código 6"],"El servidor solo tiene prueba.txt, test.txt y foto.jpg."),
 q("b32f","ftp","¿Qué está mal en el WRQ foto.jpg?",["*Lo envía el servidor: las peticiones las hace siempre el cliente (que además no tiene foto.jpg)","Le falta el DATA 1","Debería ser un RRQ del servidor","Nada"],"Si el cliente intentara escribirla, recibiría ERROR 6: el servidor ya la tiene.")]},
{id:"3.3",t:"ftp",title:"Subir apuntesRC.txt (1534 B)",d:2,qs:[

 q("b33c","ftp","¿Cuál es el último DATA?",["*El bloque 3, con 510 bytes","El bloque 3, con 512 bytes","El bloque 4, con 0 bytes","El bloque 2, con 510 bytes"],"1534 = 512 + 512 + 510, y 510 < 512 marca el final.")]},

/* ================= Utilidades ================= */
const $app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inl(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\\\*/g,"*")}
function md(src){
  const lines=src.replace(/^\n+|\s+$/g,"").split("\n"); let h="",pre=null,list=null;
  const close=()=>{if(list){h+=`</${list}>`;list=null}};
  for(const raw of lines){
    if(raw.trim().startsWith("```")){ if(pre){h+=`<pre>${esc(pre.join("\n"))}</pre>`;pre=null}else{close();pre=[]} continue; }
    if(pre){pre.push(raw);continue}
    const line=raw.trim();
    if(line.startsWith("## ")){close();h+=`<h3>${inl(line.slice(3))}</h3>`}
    else if(/^- /.test(line)){ if(list!=="ul"){close();h+="<ul>";list="ul"} h+=`<li>${inl(line.slice(2))}</li>` }
    else if(/^\d+\.\s/.test(line)){ if(list!=="ol"){close();h+="<ol>";list="ol"} h+=`<li>${inl(line.replace(/^\d+\.\s/,""))}</li>` }
    else if(line===""){close()}
    else {close();h+=`<p>${inl(line)}</p>`}
  }
  close(); if(pre) h+=`<pre>${esc(pre.join("\n"))}</pre>`;
  return h;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ================= Sesiones de preguntas ================= */
let ses=null;
function start(items,label,back,exam){
  ses={label,back:back||null,exam:!!exam,items:items.map(it=>({...it,order:shuffle([0,1,2,3].slice(0,it.qq.o.length)),pick:null})),i:0,ok:0,end:exam?Date.now()+40*60000:0};
  show(); window.scrollTo(0,0);
  if(exam){ timer=setInterval(()=>{const el=document.getElementById("clock"); const left=ses.end-Date.now(); if(left<=0){clearInterval(timer);timer=null;finish();return} if(el) el.textContent=fmt(left)},1000); }
}
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function simulacro(){
  const pick=(arr,n)=>shuffle(arr).slice(0,n);
  const dnsT=Q.filter(x=>x.t==="dns").map(x=>ALL[x.id]);
  const dnsC=[...BOL.filter(b=>b.t==="dns").flatMap(b=>b.qs),...EXTRA.filter(c=>c.t==="dns").flatMap(c=>c.qs)].map(x=>ALL[x.id]);
  const ldap=poolByTema("ldap"), ftp=poolByTema("ftp");
  const items=[...pick(dnsT,5),...pick(dnsC,7),...pick(ldap,4),...pick(ftp,4)];
  start(shuffle(items),"Simulacro",null,true);
}
function show(){
  const it=ses.items[ses.i], x=it.qq, n=ses.items.length;
  const pct=Math.round(ses.i/n*100);
  const ctx=it.ctx?`<details class="case" ${ses.exam?"":"open"}><summary>${esc(it.ctx.title)}</summary><div class="prose">${it.ctx.html()}</div></details>`:"";
  const answered=it.pick!==null, reveal=answered&&!ses.exam;
  const opts=it.order.map((oi,k)=>{
    let cls="opt";
    if(reveal){ if(oi===x.a) cls+=" right"; else if(oi===it.pick) cls+=" wrong"; }
    else if(answered && oi===it.pick) cls+=" chosen";
    return `<button class="${cls}" data-oi="${oi}" ${answered?"disabled":""}><span class="let">${L[k]}</span><span>${esc(x.o[oi])}</span></button>`;
  }).join("");
  const good=answered&&it.pick===x.a;
  const fb=reveal?`<div class="fb ${good?"":"bad"}" role="status"><b>${good?"Correcto":"No es esa. La buena: "+esc(x.o[x.a])}</b>${esc(x.e)}</div>`:"";
  $app.innerHTML=`
  <div class="top">
    <div class="toprow"><button class="ghost" data-act="salir">‹ Salir</button><span class="count">${ses.exam?`<span id="clock">${fmt(ses.end-Date.now())}</span> · `:""}${ses.i+1} / ${n}${ses.exam?"":" · "+ses.ok+" ✓"}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
  </div>
  ${ctx}
  <div class="card">
    <div><span class="chip">${TEMAS[x.t]}</span></div>
    <p class="qtext">${esc(x.q)}</p>
    <div class="opts">${opts}</div>
    ${fb}
  </div>
  ${answered?`<button class="btn primary next" data-act="next"><strong>${ses.i+1<n?"Siguiente":"Ver resultado"}</strong>${arrow}</button>`:""}
  ${ses.exam&&!answered?`<button class="ghost" data-act="skip">Dejar en blanco</button>`:""}`;
  $app.querySelector('[data-act="salir"]').onclick=()=>{ if(timer){clearInterval(timer);timer=null} ses.back?ses.back():home(); window.scrollTo(0,0); };
  if(!answered) $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
  else $app.querySelector('[data-act="next"]').onclick=next;
  const sk=$app.querySelector('[data-act="skip"]'); if(sk) sk.onclick=()=>{it.pick=-1; next();};
}
function answer(oi){
  const it=ses.items[ses.i]; if(it.pick!==null) return;
  it.pick=oi; const ok=oi===it.qq.a; if(ok) ses.ok++;
  record(it.qq.id,ok);
  const y=window.scrollY; show(); window.scrollTo(0,y);
  const target=$app.querySelector(".fb")||$app.querySelector('[data-act="next"]'); if(target&&target.scrollIntoView) target.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ if(ses.i+1<ses.items.length){ses.i++;show();window.scrollTo(0,0)} else finish(); }
function finish(){
  if(timer){clearInterval(timer);timer=null}
  const n=ses.items.length, bad=ses.items.filter(it=>it.pick!==it.qq.a);
  let head;
  if(ses.exam){
    const right=ses.ok, wrong=ses.items.filter(it=>it.pick!==null&&it.pick>=0&&it.pick!==it.qq.a).length, blank=n-right-wrong;
    const nota=right/n*10, notaPen=Math.max(0,(right-wrong/3)/n*10);
    if(S.best==null||nota>S.best){S.best=nota;save()}
    const per=Object.keys(TEMAS).map(t=>{const its=ses.items.filter(i=>i.qq.t===t);const ok=its.filter(i=>i.pick===i.qq.a).length;return `<span class="k">${TEMAS[t]}</span><div class="bar" aria-hidden="true"><i style="width:${its.length?Math.round(ok/its.length*100):0}%"></i></div><span class="n">${ok}/${its.length}</span>`}).join("");
    head=`<header class="hero"><span class="label">Simulacro</span><div class="score">${nota.toFixed(1).replace(".",",")}</div>
      <p>${right} bien · ${wrong} mal · ${blank} en blanco. Con penalización de −1/3 por fallo: <strong>${notaPen.toFixed(1).replace(".",",")}</strong>.</p></header>
      <section class="section"><span class="label">Por tema</span><div class="zone">${per}</div></section>`;
  } else {
    const msg=ses.ok===n?"Todas bien.":ses.ok/n>=0.7?"Bien. Repasa las falladas.":"Toca repasar: mira las explicaciones de abajo.";
    head=`<header class="hero"><span class="label">${esc(ses.label)}</span><div class="score">${ses.ok}/${n}</div><p>${msg}</p></header>`;
  }
  $app.innerHTML=head+`
  <section class="section">
    ${bad.length?btn('data-act="rep"',`Repetir las ${bad.length} falladas`,"",true):""}
    ${ses.back?btn('data-act="back"',ses.backLabel||"Volver","",!bad.length):""}
    ${btn('data-go="home"',"Volver al inicio","")}
  </section>
  ${bad.length?`<section class="section"><span class="label">Falladas y en blanco</span><div class="review">${bad.map(it=>`<div class="item"><span><span class="chip">${TEMAS[it.qq.t]}</span>${it.ctx?` <span class="sub">${esc(it.ctx.title)}</span>`:""}</span><strong>${esc(it.qq.q)}</strong><span class="ans">${esc(it.qq.o[it.qq.a])}</span><span class="exp">${esc(it.qq.e)}</span></div>`).join("")}</div></section>`:""}`;
  wireGo();
  const r=$app.querySelector('[data-act="rep"]'); if(r) r.onclick=()=>start(bad.map(it=>({qq:it.qq,ctx:it.ctx})),"Repetir falladas",ses.back);
  const bk=$app.querySelector('[data-act="back"]'); if(bk) bk.onclick=()=>{ses.back();window.scrollTo(0,0)};
  window.scrollTo(0,0);
}


/* ================= Resolver por escrito ================= */
let dv=null;
function sections(id){
  const el=document.getElementById(id); const src=el?el.textContent:""; const out=[]; let cur={t:"Solución",l:[]}, inPre=false;
  for(const line of src.split("\n")){
    if(line.trim().startsWith("```")) inPre=!inPre;
    if(!inPre && line.trim().startsWith("## ")){ if(cur.l.join("").trim()) out.push(cur); cur={t:line.trim().slice(3),l:[]}; }
    else cur.l.push(line);
  }
  if(cur.l.join("").trim()) out.push(cur);
  return out.map(x=>({t:x.t,html:md(x.l.join("\n"))}));
}
function escrito(id){ const b=BOL.find(x=>x.id===id); if(!b) return boletin(); devStart([id],"Problema "+id,0,()=>{problema(id);window.scrollTo(0,0)}); }

function devShow(){

function devCorrect(){
  if(timer){clearInterval(timer);timer=null}
  const G=[["1","Bien"],["0.5","A medias"],["0","Mal"]];

    const b=BOL.find(x=>x.id===id), secs=sections("sol-"+id); dv.grades[id]=dv.grades[id]||{};

      ${secs.map((sec,k)=>`<div class="card-lite stack"><h3>${inl(sec.t)}</h3><div class="prose">${sec.html}</div>
        <div class="grade" role="group" aria-label="¿Cómo te ha salido ${esc(sec.t)}?">${G.map(([v,l])=>`<button class="gbtn ${dv.grades[id][k]===+v?"on":""}" data-p="${id}" data-k="${k}" data-v="${v}">${l}</button>`).join("")}</div></div>`).join("")}
      <p class="pscore" id="ps-${id.replace(".","-")}"></p></section>`;
  }).join("");
  $app.innerHTML=`<div class="top"><div class="toprow"><button class="ghost" data-act="salir">‹ Salir</button><span class="count">Corrección</span></div></div>
  <header class="hero"><span class="label">${esc(dv.label)}</span><div class="score" id="total">–</div><p>Compara cada apartado con tu respuesta y marca cómo te ha salido. Sé exigente: si falta la justificación, es "a medias".</p></header>
  ${blocks}
  <section class="section">${dv.back?btn('data-act="back"',"Volver al problema",""):""}${btn('data-go="home"',"Volver al inicio","")}</section>`;
  wireGo();
  $app.querySelector('[data-act="salir"]').onclick=devExit;
  const bk=$app.querySelector('[data-act="back"]'); if(bk) bk.onclick=devExit;
  $app.querySelectorAll(".gbtn").forEach(g=>g.onclick=()=>{dv.grades[g.dataset.p][+g.dataset.k]=+g.dataset.v;
    g.parentElement.querySelectorAll(".gbtn").forEach(x=>x.classList.toggle("on",x===g)); devScore();});
  devScore(); window.scrollTo(0,0);
}
function devScore(){
  let notas=[];
  dv.ids.forEach(id=>{const n=sections("sol-"+id).length, g=dv.grades[id]||{}, k=Object.keys(g).length, el=document.getElementById("ps-"+id.replace(".","-"));
    if(k===n){const nota=Object.values(g).reduce((a,b)=>a+b,0)/n*10; notas.push(nota); S.dev[id]=nota; if(el) el.innerHTML=`Nota del problema: <strong>${nota.toFixed(1).replace(".",",")}</strong>`;}
    else if(el) el.textContent=`${k} de ${n} apartados corregidos`;});
  const tot=document.getElementById("total");
  if(notas.length===dv.ids.length){const m=notas.reduce((a,b)=>a+b,0)/notas.length; tot.textContent=m.toFixed(1).replace(".",","); if(dv.exam&&(S.bestDev==null||m>S.bestDev)) S.bestDev=m;}
  else tot.textContent="–";
  save();
}

/* ================= Generador de problemas DNS ================= */
function generador(){
  const R=a=>a[Math.floor(Math.random()*a.length)], rt=(a,b)=>100*(Math.floor(a/100)+Math.floor(Math.random()*((b-a)/100+1)));
  const tld=R(["com","net","es","eu","gr","pk","edu","jp"]), dom=R(["fedempes","ocio","norut","arcomp","teleco","mares","tecno","sierra","kanto","rioja"]), sub=R(["ventas","lab","tic","empleados","campus","info","docs"]);
  const ext=tld==="org"?"net":"org";
  const T=tld+".", D=dom+"."+T, SB=sub+"."+D, H="www."+SB;
  const nsT="a.nic."+T, nsD1="dns."+D, nsD2="ns2.externo."+ext+".", nsS="srv."+SB;
  const ip=()=>40+"."+(1+Math.floor(Math.random()*250))+"."+(1+Math.floor(Math.random()*250))+"."+(1+Math.floor(Math.random()*250));
  const E={nsT:rt(800,2000),aT:rt(2000,5000),nsD1:rt(600,2500),nsD2:rt(600,2500),aD1:rt(800,4000),aD2:rt(800,4000),nsS:rt(500,2000),aS:rt(800,3000),aH:rt(300,1500)};
  const lines=[[T,E.nsT,"NS",nsT],[nsT,E.aT,"A",ip()],[D,E.nsD1,"NS",nsD1],[D,E.nsD2,"NS",nsD2],[nsD1,E.aD1,"A",ip()],[nsD2,E.aD2,"A",ip()],[SB,E.nsS,"NS",nsS],[nsS,E.aS,"A",ip()],[H,E.aH,"A","150."+Math.floor(Math.random()*250)+".1."+Math.floor(1+Math.random()*250)]];
  const w=Math.max(...lines.map(l=>l[0].length));
  const code=lines.map(l=>`${l[0].padEnd(w)} ${String(l[1]).padStart(4)} IN ${l[2].padEnd(2)} ${l[3]}`).join("\n");
  const Z={raiz:{name:"la raíz",srv:[]},tld:{name:T,srv:[[nsT,E.nsT,E.aT]]},dom:{name:D,srv:[[nsD1,E.nsD1,E.aD1],[nsD2,E.nsD2,E.aD2]]},sub:{name:SB,srv:[[nsS,E.nsS,E.aS]]},otra:{name:"otra zona",srv:[]}};
  const usable=(z,t)=>z==="raiz"||Z[z].srv.some(([,ns,a])=>t<ns&&t<a);
  const label={cache:"Responde desde la caché",raiz:"Por la raíz",tld:"Por el servidor de "+T,dom:"Por un servidor de "+D,sub:"Por el servidor de "+SB};
  function solve(target,t){
    if(target.n===H && t<E.aH) return {start:"cache",servers:1,why:`El A de ${H} (TTL ${E.aH}) sigue vivo en t = ${t}: se responde desde la caché, sin preguntar a nadie.`};
    const chain=target.chain; let i=0;
    for(let k=chain.length-1;k>=0;k--){ if(usable(chain[k],t)){i=k;break} }
    const why=[]; if(target.n===H) why.push(`El A de ${H} (TTL ${E.aH}) ya ha caducado.`);
    for(let k=chain.length-1;k>i;k--){const z=chain[k]; if(z==="otra") continue; Z[z].srv.forEach(([n,ns,a])=>why.push(`${Z[z].name}: NS → ${n} (${ns}) ${t<ns?"vivo":"caducado"}, A (${a}) ${t<a?"vivo":"caducado"}.`));}
    const st=chain[i];
    if(st!=="raiz") { const ok=Z[st].srv.filter(([,ns,a])=>t<ns&&t<a).map(([n,ns,a])=>`${n} (NS ${ns}, A ${a})`); why.push(`Sigue vivo ${ok.join(" y ")}: empieza por ahí.`); }
    else why.push("No queda ningún NS vivo con su A: hay que empezar por la raíz.");
    const servers=1+(chain.length-i);
    why.push(`Servidores: el DNS por defecto + ${chain.length-i} (${chain.slice(i).map(z=>z==="otra"?"el de la zona consultada":Z[z].name).join(" → ")}) = ${servers}.`);
    return {start:st,servers,why:why.join(" ")};
  }
  const targets=[{n:H,chain:["raiz","tld","dom","sub"]},{n:"ftp."+SB,chain:["raiz","tld","dom","sub"]},{n:"mail."+D,chain:["raiz","tld","dom"]},{n:"www.otra."+T,chain:["raiz","tld","otra"]}];
  const maxT=Math.max(...Object.values(E));
  const qs=[q("g-0","dns","¿Qué se consultó en t = 0?",["*El A de "+H,"El NS de "+D,"El A de "+nsD1,"El NS de "+T],"Es el único A que no pertenece a un servidor DNS.")];
  const used=new Set(); let k=1, guard=0;
  while(qs.length<7 && guard++<60){
    const tg=R(targets), t=rt(100,Math.min(maxT,5000)); const key=tg.n+t; if(used.has(key)) continue; used.add(key);
    const r=solve(tg,t);
    const others=Object.keys(label).filter(x=>x!==r.start && (x==="cache"?tg.n===H:tg.chain.includes(x)));
    const opts=["*"+label[r.start],...shuffle(others).slice(0,3).map(x=>label[x])];
    while(opts.length<4){const extra=Object.keys(label).find(x=>!opts.some(o=>o.replace("*","")===label[x])); opts.push(label[extra]);}
    qs.push(q("g-"+k++,"dns",`En t = ${t} s se pregunta ${tg.n} ¿Por dónde empieza la resolución?`,opts,r.why));
    if(qs.length<7 && Math.random()<0.6){
      const nums=new Set([r.servers]); while(nums.size<4){const v=r.servers+R([-2,-1,1,2,3]); if(v>=1) nums.add(v);}
      qs.push(q("g-"+k++,"dns",`En t = ${t} s, ¿cuántos servidores DNS intervienen al resolver ${tg.n} (contando el DNS por defecto)?`,[...nums].map(v=>(v===r.servers?"*":"")+v),r.why));
    }
  }
  const ctx={title:"Problema generado",html:()=>`<p>Caché del DNS por defecto justo tras resolver una consulta (t = 0). TTL en segundos. Todas las consultas posteriores llegan a este servidor, y ninguna de ellas cambia la caché.</p><pre>${esc(code)}</pre>`};
  start(qs.map(x=>({qq:x,ctx})),"Generador DNS",generador);
  ses.backLabel="Otro problema";
}

/* Teclado: 1-4 para responder, Enter para seguir */
document.addEventListener("keydown",e=>{
  if(!ses||!$app.querySelector(".card")) return;
  const it=ses.items[ses.i];
  if(it.pick===null && /^[1-4]$/.test(e.key)){const k=+e.key-1; if(k<it.order.length) answer(it.order[k]);}
  else if(it.pick!==null && e.key==="Enter"){e.preventDefault(); next();}
});

home();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
